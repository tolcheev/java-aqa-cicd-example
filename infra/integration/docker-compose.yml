name: java-aqa-integration

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: aqa
      POSTGRES_USER: aqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create infra/integration/.env from .env.example}
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqa -d aqa"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - integration-postgres:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  vault:
    image: hashicorp/vault:1.21.1
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:?Create infra/integration/.env from .env.example}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "18200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.21.1
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:?Create infra/integration/.env from .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create infra/integration/.env from .env.example}
    volumes:
      - ./init-vault.sh:/init-vault.sh:ro
    depends_on:
      vault:
        condition: service_healthy

volumes:
  integration-postgres:
